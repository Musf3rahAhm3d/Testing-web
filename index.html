<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #08070d;
    --bg-deep: #0c0a14;
    --surface: #12101c;
    --surface-2: #171425;
    --surface-hover: #1b1729;
    --border: #241f36;
    --border-strong: #362d52;
    --purple: #9b6bff;
    --purple-bright: #b98cff;
    --purple-dim: #5e4499;
    --purple-glow: rgba(155, 107, 255, 0.35);
    --text: #e9e6f2;
    --text-dim: #9691ac;
    --text-faint: #5d5876;
    --easy: #9b6bff;
    --medium: #ffb547;
    --hard: #ff6b6b;
    --ok: #58e0b8;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    position: relative;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 40px 24px 90px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- ambient background ---------- */
  .bg-fx{ position: fixed; inset: 0; z-index: -2; pointer-events: none; overflow: hidden; }
  .bg-grid{
    position: absolute; inset: -1px;
    background-image:
      linear-gradient(rgba(155,107,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(155,107,255,0.05) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 90%);
  }
  .bg-glow{ position:absolute; border-radius:50%; filter: blur(90px); opacity:0.55; }
  .bg-glow.g1{ width:520px; height:520px; top:-220px; left:-120px; background: radial-gradient(circle, rgba(155,107,255,0.35), transparent 70%); animation: drift1 26s ease-in-out infinite alternate; }
  .bg-glow.g2{ width:460px; height:460px; top:120px; right:-160px; background: radial-gradient(circle, rgba(97,60,190,0.3), transparent 70%); animation: drift2 32s ease-in-out infinite alternate; }
  .bg-glow.g3{ width:380px; height:380px; bottom:-160px; left:35%; background: radial-gradient(circle, rgba(88,224,184,0.08), transparent 70%); animation: drift1 22s ease-in-out infinite alternate-reverse; }
  @keyframes drift1{ from{ transform: translate(0,0); } to{ transform: translate(40px, 30px); } }
  @keyframes drift2{ from{ transform: translate(0,0); } to{ transform: translate(-30px, 40px); } }
  .bg-scan{
    position:absolute; left:0; right:0; height:120px;
    background: linear-gradient(rgba(155,107,255,0) 0%, rgba(155,107,255,0.05) 50%, rgba(155,107,255,0) 100%);
    animation: scan 9s linear infinite;
  }
  @keyframes scan{ from{ top:-120px; } to{ top:100vh; } }
  .node{ position:absolute; width:3px; height:3px; border-radius:50%; background: var(--purple-bright); opacity:0; box-shadow: 0 0 8px 1px var(--purple-glow); animation: twinkle 6s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:0; transform: scale(0.6); } 40%{ opacity:0.9; transform: scale(1); } 60%{ opacity:0.5; } }

  @media (prefers-reduced-motion: reduce){
    .bg-glow, .bg-scan, .node{ animation: none !important; }
  }

  .wrap{ max-width: 1120px; margin: 0 auto; position: relative; z-index: 1; }
  .icon{ display:inline-flex; }
  .icon svg{ display:block; }

  /* ---------- header ---------- */
  header{
    margin-bottom: 28px;
    border-left: 2px solid var(--purple);
    padding-left: 18px;
    display:flex;
    align-items:flex-start;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--purple-bright);
    letter-spacing: 0.06em;
    margin-bottom: 10px;
    display:flex;
    align-items:center;
    gap: 7px;
    text-transform: uppercase;
  }
  h1{
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
    color: #fff;
    text-shadow: 0 0 30px rgba(155,107,255,0.25);
  }
  header p{
    color: var(--text-dim);
    font-size: 14.5px;
    max-width: 540px;
    line-height: 1.6;
    margin: 0;
  }
  .hacker-badge{
    position: relative;
    display:flex;
    flex-direction: column;
    align-items:center;
    width: 108px;
    flex-shrink: 0;
  }
  .hacker-glow{
    position:absolute; top:-10px; left:50%; transform: translateX(-50%);
    width: 130px; height: 130px; border-radius:50%;
    background: radial-gradient(circle, rgba(155,107,255,0.28), transparent 70%);
    filter: blur(6px);
    animation: hackerbob 5s ease-in-out infinite;
  }
  .hacker-fig{
    position: relative;
    width: 108px; height: auto;
    filter: drop-shadow(0 6px 18px rgba(155,107,255,0.35));
    animation: hackerbob 5s ease-in-out infinite;
  }
  @keyframes hackerbob{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce){ .hacker-glow, .hacker-fig{ animation: none !important; } }
  .hacker-tag{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--ok);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display:flex; align-items:center; gap:6px;
    margin-top: 8px;
  }
  .pulse-dot{ width:7px; height:7px; border-radius:50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(88,224,184,0.6); animation: pulse 2.2s ease-out infinite; flex-shrink:0; }
  @keyframes pulse{ 0%{ box-shadow: 0 0 0 0 rgba(88,224,184,0.5); } 70%{ box-shadow: 0 0 0 7px rgba(88,224,184,0); } 100%{ box-shadow: 0 0 0 0 rgba(88,224,184,0); } }

  /* ---------- stats dashboard ---------- */
  .stats{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 0 0 28px;
  }
  .stat{
    position:relative;
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    overflow:hidden;
    transition: border-color .2s ease, transform .2s ease;
  }
  .stat:hover{ border-color: var(--border-strong); transform: translateY(-2px); }
  .stat::after{
    content:""; position:absolute; top:-30px; right:-30px; width:90px; height:90px; border-radius:50%;
    background: radial-gradient(circle, var(--stat-glow, rgba(155,107,255,0.18)), transparent 70%);
  }
  .stat .stat-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 12px; }
  .stat-icon{
    width: 30px; height: 30px; border-radius: 7px;
    display:flex; align-items:center; justify-content:center;
    background: var(--stat-bg, rgba(155,107,255,0.12));
    color: var(--stat-color, var(--purple-bright));
  }
  .stat-icon svg{ width:16px; height:16px; }
  .stat-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .stat-value{ font-size: 26px; font-weight: 700; color: #fff; line-height:1; margin-bottom: 4px; }
  .stat-sub{ font-size: 11.5px; color: var(--text-dim); }
  .diff-bar{ display:flex; height:6px; border-radius:4px; overflow:hidden; margin-top:10px; background: var(--border); }
  .diff-bar span{ height:100%; }

  /* ---------- controls ---------- */
  .panel{
    background: rgba(18,16,28,0.55);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    backdrop-filter: blur(8px);
    margin-bottom: 22px;
  }
  .panel-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom: 10px;
  }
  .controls{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  select, button{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 9px 14px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  select:hover, button:hover{ border-color: var(--purple-dim); color: var(--purple-bright); box-shadow: 0 0 0 1px rgba(155,107,255,0.15); }
  select:focus, button:focus{ outline: none; border-color: var(--purple); }
  #reset{ margin-left: auto; color: var(--text-dim); display:flex; align-items:center; gap:6px; }
  #reset:hover{ color: var(--purple-bright); }

  .meta-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin: 0 0 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .meta-row .count-line{ display:flex; align-items:center; gap:7px; }
  .legend{ display:flex; gap:16px; }
  .dot{ width:6px; height:6px; border-radius:50%; display:inline-block; margin-right:6px; flex-shrink:0; }

  /* ---------- cards ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
  }
  .card{
    background: linear-gradient(155deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px 22px;
    position: relative;
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
    transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease, border-color .2s ease;
  }
  .card::before{
    content:"";
    position:absolute; top:0; right:0; width:16px; height:16px;
    background: var(--border);
    clip-path: polygon(100% 0, 0 0, 100% 100%);
    transition: background .2s ease;
  }
  .card::after{
    content:"";
    position:absolute; left:10px; bottom:10px; width:10px; height:10px;
    border-left: 1.5px solid var(--border-strong); border-bottom: 1.5px solid var(--border-strong);
    opacity: 0; transition: opacity .2s ease;
  }
  .card:hover{
    transform: translateY(-6px);
    border-color: var(--purple);
    box-shadow: 0 18px 36px -12px rgba(155,107,255,0.22), 0 0 0 1px rgba(155,107,255,0.35), 0 0 28px rgba(155,107,255,0.12);
  }
  .card:hover::before{ background: var(--purple); }
  .card:hover::after{ opacity: 1; border-color: var(--purple-bright); }
  .card-top{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .level{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight: 600;
    padding: 4px 10px 4px 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display:flex; align-items:center; gap:5px;
    clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 0% 100%);
  }
  .level .ldot{ width:5px; height:5px; border-radius:50%; }
  .level.Easy{ background: rgba(155,107,255,0.12); color: var(--easy); }
  .level.Easy .ldot{ background: var(--easy); box-shadow: 0 0 6px var(--easy); }
  .level.Medium{ background: rgba(255,181,71,0.12); color: var(--medium); }
  .level.Medium .ldot{ background: var(--medium); box-shadow: 0 0 6px var(--medium); }
  .level.Hard{ background: rgba(255,107,107,0.12); color: var(--hard); }
  .level.Hard .ldot{ background: var(--hard); box-shadow: 0 0 6px var(--hard); }
  .status{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    display:flex;
    align-items:center;
    gap: 5px;
  }
  .status .icon svg{ width:12px; height:12px; }
  .status.available{ color: var(--ok); }
  .card-icon-row{ display:flex; align-items:center; gap:9px; margin-bottom: 10px; }
  .tactic-icon{
    width:26px; height:26px; border-radius:6px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(155,107,255,0.1); color: var(--purple-bright);
  }
  .tactic-icon svg{ width:14px; height:14px; }
  .technique{
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    color: #fff;
  }
  .technique .sub{ color: var(--text-dim); font-weight: 400; }
  .tags{
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 14px;
    font-family: 'JetBrains Mono', monospace;
  }
  .divider{ border-top: 1px dashed var(--border); margin: 14px 0; }
  .nist{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    display:flex; align-items:center; gap:6px;
  }
  .empty{
    grid-column: 1/-1;
    text-align:center;
    padding: 60px 20px;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  @media (max-width: 720px){
    .stats{ grid-template-columns: repeat(2, 1fr); }
    header{ flex-direction: column; }
  }
</style>
</head>
<body>

<div class="bg-fx">
  <div class="bg-grid"></div>
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>
  <div class="bg-glow g3"></div>
  <div class="bg-scan"></div>
  <div id="nodes"></div>
</div>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow"><span class="icon" id="ic-shield"></span> Challenge Board // Threat Coverage</div>
      <h1>Open challenge slots</h1>
      <p>Every card is a technique that needs a CTF challenge built for it. Pick one, build it, submit it for review.</p>
    </div>
    <div class="hacker-badge">
      <div class="hacker-glow"></div>
      <svg class="hacker-fig" viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#c9aeff"/>
            <stop offset="100%" stop-color="#7c4dff"/>
          </linearGradient>
          <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2a2340"/>
            <stop offset="100%" stop-color="#171225"/>
          </linearGradient>
        </defs>
        <path d="M70,10 C50,10 35,24 31,42 C29,51 30,59 34,65 C27,70 19,79 13,90 C9,97 13,101 19,97 C25,93 31,87 37,83 C33,89 29,97 27,105 C25,111 29,115 34,111 C41,105 45,97 49,89 C55,93 62,95 70,95 C78,95 85,93 91,89 C95,97 99,105 106,111 C111,115 115,111 113,105 C111,97 107,89 103,83 C109,87 115,93 121,97 C127,101 131,97 127,90 C121,79 113,70 106,65 C110,59 111,51 109,42 C105,24 90,10 70,10 Z" fill="url(#hoodGrad)"/>
        <path d="M70,34 C60,34 52,44 52,55 C52,64 57,71 63,74 L63,80 L77,80 L77,74 C83,71 88,64 88,55 C88,44 80,34 70,34 Z" fill="#0c0a14" opacity="0.85"/>
        <rect x="34" y="96" width="72" height="46" rx="4" fill="url(#laptopGrad)" stroke="#3a3153" stroke-width="1.5"/>
        <rect x="41" y="103" width="58" height="30" rx="2" fill="#0c0a14"/>
        <text x="46" y="122" font-family="JetBrains Mono, monospace" font-size="12" fill="#b98cff">&gt;_</text>
        <rect x="30" y="140" width="80" height="5" rx="2" fill="#241f36"/>
      </svg>
      <div class="hacker-tag"><span class="pulse-dot"></span>Board Live</div>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <div class="panel-label"><span class="icon" id="ic-filter"></span> Filters</div>
    <div class="controls">
      <select id="f-nist"></select>
      <select id="f-skill"></select>
      <select id="f-level"></select>
      <button id="reset"><span class="icon" id="ic-reset"></span>Reset filters</button>
    </div>
  </div>

  <div class="meta-row">
    <span class="count-line"><span class="icon" id="ic-target"></span><span id="count"></span></span>
    <span class="legend">
      <span><span class="dot" style="background: var(--ok);"></span>Available</span>
      <span><span class="dot" style="background: var(--text-faint);"></span>Claimed</span>
    </span>
  </div>

  <div class="grid" id="cards"></div>
</div>

<script>
/* ---------------- inline icon set (no external deps) ---------------- */
const ICONS = {
  shield: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v6c0 5 3.2 8.4 7 9 3.8-.6 7-4 7-9V6z"/></svg>',
  clock: '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 3.5"/></svg>',
  filter: '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></svg>',
  reset: '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
  target: '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/></svg>',
  layers: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 16l9 5 9-5"/><path d="M3 12l9 5 9-5"/></svg>',
  unlock: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.2-2.4"/></svg>',
  lock: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  chart: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M4 20h16"/></svg>',
  radar: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12 18 7"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>',
  database: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v6c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8v-6"/><path d="M4.5 11.5v6c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8v-6"/></svg>',
  key: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="3.8"/><path d="M10.5 12.5 19.5 3.5"/><path d="M16.5 6.5 19 9"/><path d="M13.5 9.5 15.5 11.5"/></svg>',
  terminal: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l4 3-4 3"/><path d="M13 16h4"/></svg>',
  activity: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>',
  globe: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 4 5.7 4 9s-1.5 6.4-4 9c-2.5-2.6-4-5.7-4-9s1.5-6.4 4-9Z"/></svg>'
};
function setIcon(id, key){ const el = document.getElementById(id); if(el) el.innerHTML = ICONS[key]; }
setIcon('ic-shield','shield');
setIcon('ic-filter','filter');
setIcon('ic-reset','reset');
setIcon('ic-target','target');

const TACTIC_ICON = { Discovery:'radar', Collection:'database', Persistence:'key', Execution:'terminal', Exfiltration:'globe' };

/* ---------------- ambient background nodes ---------------- */
const nodeLayer = document.getElementById('nodes');
for(let i=0;i<18;i++){
  const n = document.createElement('div');
  n.className='node';
  n.style.left = Math.random()*100 + '%';
  n.style.top = Math.random()*100 + '%';

/* ---------------- filters ---------------- */
function unique(arr){ return [...new Set(arr)]; }
function fillSelect(sel, values, allLabel){
  sel.innerHTML = '<option value="">' + allLabel + '</option>' + values.map(v => '<option value="'+v+'">'+v+'</option>').join('');
}
fillSelect(document.getElementById('f-nist'), unique(data.map(d => d.nist)), 'All NIST functions');
fillSelect(document.getElementById('f-skill'), unique(data.map(d => d.skill)), 'All defend skills');
fillSelect(document.getElementById('f-level'), unique(data.map(d => d.level)), 'All levels');

function filtered(){
  const nist = document.getElementById('f-nist').value;
  const skill = document.getElementById('f-skill').value;
  const level = document.getElementById('f-level').value;
  return data.filter(d =>
    (!nist || d.nist === nist) &&
    (!skill || d.skill === skill) &&
    (!level || d.level === level)
  );
}

function render(){
  const list = filtered();
  document.getElementById('count').textContent = list.length + (list.length === 1 ? ' slot open' : ' slots open');
  const grid = document.getElementById('cards');
  if(list.length === 0){
    grid.innerHTML = '<div class="empty">No slots match these filters.</div>';
    return;
  }
  grid.innerHTML = list.map(d => {
    const iconKey = TACTIC_ICON[d.tactic] || 'activity';
    return `
    <div class="card">
      <div class="card-top">
        <span class="level ${d.level}"><span class="ldot"></span>${d.level}</span>
        <span class="status ${d.claimed ? '' : 'available'}"><span class="icon">${d.claimed ? ICONS.lock : ICONS.unlock}</span>${d.claimed ? 'Claimed' : 'Available'}</span>
      </div>
      <div class="card-icon-row">
        <div class="tactic-icon">${ICONS[iconKey]}</div>
        <div class="tags" style="margin:0;">${d.tactic} &middot; ${d.skill}${d.subskill ? ' / ' + d.subskill : ''}</div>
      </div>
      <div class="technique">${d.technique}${d.subtech ? ` <span class="sub">&rsaquo; ${d.subtech}</span>` : ''}</div>
      <div class="divider"></div>
      <div class="nist"><span class="icon">${ICONS.shield}</span>${d.nist}</div>
    </div>
  `;
  }).join('');
}

['f-nist','f-skill','f-level'].forEach(id => document.getElementById(id).addEventListener('change', render));
document.getElementById('reset').addEventListener('click', () => {
  document.getElementById('f-nist').value = '';
  document.getElementById('f-skill').value = '';
  document.getElementById('f-level').value = '';
  render();
});
render();
